# ArtTouch NFC 互动视频系统 - Nginx配置

# 限制上传大小
client_max_body_size 200M;

# NFC公开播放页 - /n/{code} 格式
location /n/ {
    alias /home/admin/artouch/static/nfc/play.html;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# 播放页静态文件 (旧路径兼容)
location /nfc/ {
    alias /home/admin/artouch/static/nfc/;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# 视频防盗链
location /videos/ {
    alias /home/admin/artouch/videos/;
    valid_referers none blocked server_names *.artouch.tech;
    if ($invalid_referer) {
        return 403;
    }
    expires 7d;
    add_header Cache-Control "public";
}

# API代理到FastAPI
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# 管理后台静态文件
location /admin/ {
    alias /home/admin/artouch/frontend/dist/;
    try_files $uri $uri/ /admin/index.html;
    
    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# 根路径重定向到管理后台
location = / {
    return 302 /admin/;
}

# 健康检查
location /health {
    access_log off;
    return 200 "OK\n";
    add_header Content-Type text/plain;
}
