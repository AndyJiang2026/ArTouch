<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink: #2c1810;
  --ink-light: #5d4037;
  --paper: #f5f0e8;
  --paper-dark: #e8dcc8;
  --gold: #c9a96e;
  --gold-light: #e8d5a3;
  --red: #b22222;
  --shadow: rgba(44,24,16,0.15);
  --tile-gap: 6px;
}
html{overflow-x:hidden;overflow-y:auto;width:100%}
body{
  font-family: "STKaiti","KaiTi","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  background: var(--paper);
  color: var(--ink);
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
  width:100%;
  padding-bottom:env(safe-area-inset-bottom,16px);
  -webkit-font-smoothing:antialiased;
}
#loading-screen{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:stretch;width:100%;justify-content:center;
  background:var(--paper);
  transition:opacity .5s ease;
}
#loading-screen.hidden{opacity:0;pointer-events:none}
.loading-spinner{
  width:48px;height:48px;
  border:3px solid var(--paper-dark);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:20px;font-size:clamp(33px,12.0vw,48px);color:var(--ink-light);letter-spacing:2px}
#app{display:none}
#app.ready{display:block}
.header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;padding-top:max(20px,env(safe-area-inset-top));
  background:var(--paper);
  border-bottom:1px solid var(--paper-dark);
}
.header-left{display:flex;align-items:center;gap:8px}
.artouch-logo{
  font-size:clamp(34px,11vw,72px);font-weight:800;
  letter-spacing:-0.02em;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  display:flex;align-items:center;gap:0;
}
.artouch-logo .logo-ar{color:#EA4335}
.artouch-logo .logo-touch{color:#4285F4}
.header-stats{display:flex;gap:24px;font-size:clamp(27px,8vw,39px);color:var(--ink-light)}
.header-stats span{white-space:nowrap}
/* 画卷选择器 */
.gallery-bar{
  display:flex;gap:10px;padding:16px 24px;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  border-bottom:1px solid var(--paper-dark);
}
.gallery-bar::-webkit-scrollbar{display:none}
.gallery-btn{
  flex-shrink:0;
  padding:14px 30px;
  border:1px solid var(--paper-dark);
  border-radius:16px;
  background:transparent;
  color:var(--ink-light);
  font-family:inherit;font-size:clamp(27px,8.2vw,39px);
  cursor:pointer;white-space:nowrap;
  transition:all .2s;
}
.gallery-btn.active{
  border-color:var(--gold);
  background:var(--gold-light);
  color:var(--ink);
  font-weight:600;
}
.puzzle-section{
  display:flex;flex-direction:column;align-items:stretch;width:100%;
  padding:0;
  margin:0;
  overflow:visible;
  gap:0;
}
.puzzle-container{
  position:relative;
  width:100%;min-width:100%;max-width:100%;height:auto;aspect-ratio:1/1;
  background:var(--paper-dark);
  border:none;
  border-radius:0;
  box-shadow:none;
  overflow:hidden;
  margin:0;
}
.reference-hint{
  position:absolute;right:8px;bottom:8px;
  width:60px;height:60px;
  border:none;
  border-radius:4px;
  background:var(--paper);
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  z-index:10;
  cursor:pointer;
  transition:transform .2s;
}
.reference-hint:active{transform:scale(.9)}
.reference-hint img{width:100%;height:100%;object-fit:cover;border-radius:2px}
#ref-modal{
  display:none;position:fixed;inset:0;z-index:5000;
  background:rgba(0,0,0,0.85);
  align-items:center;justify-content:center;
  padding:20px;
}
#ref-modal.show{display:flex}
#ref-modal img{
  max-width:100%;max-height:90vh;
  border:3px solid var(--gold);
  border-radius:0;
  box-shadow:0 0 40px rgba(0,0,0,0.5);
}
.grid{
  display:grid;
  width:100%;height:100%;
  padding:var(--tile-gap);
}
.grid-3x3{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.tile{
  position:relative;
  width:100%;height:100%;
  border-radius:4px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;
  background-size:cover;
  will-change:transform;
}
.tile:active:not(.tile-empty){transform:scale(.93)}
.tile.tile-empty{background:rgba(201,169,110,0.18);border:1.5px dashed var(--gold);cursor:default;box-shadow:none}
.tile.tile-movable:not(.tile-empty):after{
  content:'';position:absolute;inset:0;
  box-shadow:inset 0 0 8px var(--gold);
  border-radius:4px;
}
.victory-overlay{
  display:none;
  position:absolute;inset:0;z-index:50;
  background:rgba(0,0,0,0.3);
  align-items:center;justify-content:center;
  pointer-events:none;
}
.victory-overlay.show{display:flex}
.victory-text{
  font-size:clamp(54px,15.0vw,84px);color:var(--gold);
  text-shadow:0 2px 10px rgba(0,0,0,0.5);
  letter-spacing:4px;
  animation:victoryPulse 1s ease-in-out infinite;
}
@keyframes victoryPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.03)}}
.actions{
  display:flex;gap:16px;
  margin-top:24px;
  flex-wrap:wrap;justify-content:center;
}
.btn{
  padding:16px 44px;
  border:1px solid var(--gold);
  border-radius:20px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:var(--ink);
  font-family:inherit;font-size:clamp(33px,9.8vw,45px);font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.96)}
.btn-outline{
  background:transparent;
  border-color:var(--ink-light);
  color:var(--ink-light);
}
.btn-outline:active{background:var(--paper-dark)}
.btn-sm{padding:12px 28px;font-size:clamp(24px,7.5vw,33px);border-radius:16px}
.story-section{
  margin:32px 24px 56px;
  padding:32px 24px;
  background:var(--paper);
  border:1px solid var(--paper-dark);
  border-radius:12px;
  box-shadow:0 2px 12px var(--shadow);
}
.story-title{
  font-size:clamp(36px,10.5vw,51px);font-weight:700;letter-spacing:2px;
  margin-bottom:16px;
  color:var(--ink);
}
.story-title span{color:var(--red);margin-right:4px}
.story-body{
  font-size:clamp(30px,9.0vw,42px);line-height:1.9;
  color:var(--ink-light);
  text-indent:2em;
}
.story-body p{margin-bottom:6px}

.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  z-index:8000;
  padding:10px 28px;
  background:rgba(44,24,16,0.85);
  color:var(--gold-light);
  font-size:clamp(26px,7.5vw,33px);letter-spacing:1px;
  border-radius:20px;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1}
.star-effect{
  position:absolute;pointer-events:none;
  font-size:clamp(54px,15.0vw,78px);
  animation:starFly .8s ease-out forwards;
  z-index:100;
}
@keyframes starFly{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-40px) scale(.3)}
}
@media(max-width:767px){
  .puzzle-container{width:100vw;min-width:100vw;max-width:100vw;height:min(100vw,calc(100vh - 300px),calc(100dvh - 300px));aspect-ratio:auto}
  .puzzle-section{padding:0;margin:0;width:100vw;max-width:100vw}
  .header{padding:8px 12px}
  .gallery-bar{padding:10px 24px}
  .story-section{padding:8px;margin:8px 16px 16px;max-height:30vh;overflow-y:auto}
  .actions{margin-top:6px}
}
@media(min-width:768px){
  .puzzle-container{max-width:480px;margin:0 auto}
}

<div id="app">
  <div class="header">

<div class="toast" id="toast"></div>

<script>
// ============================
//  画卷库 — 从后台API动态加载
// ============================
let GALLERY = [];
// 从后台API /api/gallery 动态加载画卷列表（fallback到 gallery.json）
async function loadGallery() {
  try {
    const resp = await fetch("/api/gallery");
    if (!resp.ok) throw new Error("API不可用");
    GALLERY = await resp.json();
  } catch (e) {
    console.warn("API加载失败，使用gallery.json fallback:", e);
    try {
      const resp2 = await fetch("/static/game/gallery.json");
      GALLERY = (await resp2.json()).filter(a => a.enabled !== false);
    } catch(e2) {
      console.warn("gallery.json也加载失败", e2);
      GALLERY = [];
    }
  }
  document.dispatchEvent(new CustomEvent("gallery-ready"));
}
//  音效引擎
// ============================
const SFX = {
  ctx: null,
  _ctx(){
    if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  },
  click(){
    const c=this._ctx(),o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(660,c.currentTime+.08);
    g.gain.setValueAtTime(.12,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);
    o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+.12);
  },
  error(){
    const c=this._ctx(),o=c.createOscillator(),g=c.createGain();
    o.type='square';o.frequency.setValueAtTime(240,c.currentTime);
    o.frequency.setValueAtTime(200,c.currentTime+.1);
    g.gain.setValueAtTime(.08,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);
    o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+.2);
  },
  victory(){
    // 古风庆祝音效：五声音阶琶音 + 泛音和弦
    const c=this._ctx();
    // 第一段：低音到高音的五声音阶上行（古筝扫弦感）
    const pentatonic = [262, 294, 330, 392, 440, 523, 587, 659]; // C D E G A C' D' E'
    pentatonic.forEach((freq,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='triangle';
      const t=c.currentTime+i*.07;
      o.frequency.setValueAtTime(freq,t);
      // 加入轻微颤音
      const lfo=c.createOscillator();
      lfo.type='sine';
      lfo.frequency.setValueAtTime(6,t);
      const lg=c.createGain();
      lg.gain.setValueAtTime(4,t);
      lfo.connect(lg);lg.connect(o.frequency);
      lfo.start(t);lfo.stop(t+.4);
      g.gain.setValueAtTime(.10,t);
      g.gain.linearRampToValueAtTime(.001,t+.35);
      o.connect(g);g.connect(c.destination);
      o.start(t);o.stop(t+.35);
    });
    // 第二段：厚重的大和弦（C大调终止感）
    [523, 659, 784, 1047].forEach((freq,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';
      const t=c.currentTime+.6+i*.06;
      o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(.13,t);
      g.gain.linearRampToValueAtTime(.001,t+.8);
      o.connect(g);g.connect(c.destination);
      o.start(t);o.stop(t+.8);
    });
  },
  slide(){
    const c=this._ctx(),o=c.createOscillator(),g=c.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(300,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(600,c.currentTime+.1);
    g.gain.setValueAtTime(.06,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.15);
    o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+.15);
  },
  gallop(){
    const c=this._ctx();
    for(let i=0;i<8;i++){
      const o=c.createOscillator(),g=c.createGain();
      o.type='square';
      const t=c.currentTime+i*.08;
      o.frequency.setValueAtTime(120+Math.random()*40,t);
      g.gain.setValueAtTime(.04,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.06);
      o.connect(g);g.connect(c.destination);
      o.start(t);o.stop(t+.06);
    }
  },
  neigh(){
    const c=this._ctx(),o=c.createOscillator(),g=c.createGain(),n=c.createOscillator();
    o.type='sawtooth';n.type='sawtooth';
    o.frequency.setValueAtTime(400,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(1200,c.currentTime+.4);
    n.frequency.setValueAtTime(350,c.currentTime);
    n.frequency.exponentialRampToValueAtTime(1100,c.currentTime+.4);
    g.gain.setValueAtTime(.06,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
    o.connect(g);n.connect(g);g.connect(c.destination);
    o.start();n.start();o.stop(c.currentTime+.5);n.stop(c.currentTime+.5);
  },
  // 古风背景音（若用户开启了，这里简单示意）
  guzhengNote(freq,time){
    const c=this._ctx(),o=c.createOscillator(),g=c.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(freq,c.currentTime+time);
    g.gain.setValueAtTime(.05,c.currentTime+time);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+time+1.2);
    o.connect(g);g.connect(c.destination);
    o.start(c.currentTime+time);o.stop(c.currentTime+time+1.2);
  }
};

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._hide);t._hide=setTimeout(()=>t.classList.remove('show'),1500);
}

// ============================
//  拼图引擎
// ============================
const Puzzle = {
  // 固定3×3
  tiles: [],
  emptyIdx: 0,
  moves: 0,
  timer: 0,
  timerInt: null,
  _startTime: null,
  solved: false,
  currentAlbum: 0,
  imageTiles: [],
  _moving: false,
  _touchHandled: false,
  _victoryTimeouts: [],
  _albumLoadSeq: 0,

  async init(){
    // 渲染画卷栏
    this._renderGallery();
    // 检测URL参数?album=xxx 选择指定画卷
    const params=new URLSearchParams(window.location.search);
    const albumParam=params.get('album');
    let startIdx=0;
    if(albumParam){
      const found=GALLERY.findIndex(a=>a.id===albumParam);
      if(found>=0) startIdx=found;
    }
    try {
      await this.selectAlbum(startIdx);
    } catch(e) {
      console.error('Init failed:', e);
      showToast('加载失败，请刷新页面');
    }
    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('app').classList.add('ready');
  },

  _renderGallery(){
    const bar=document.getElementById('gallery-bar');
    bar.innerHTML='';
    GALLERY.forEach((album,i)=>{
      const btn=document.createElement('button');
      btn.className='gallery-btn'+(i===0?' active':'');
      btn.textContent=album.title.replace(/ ·.*$/,'');
      btn.dataset.idx=i;
      btn.addEventListener('click',()=>{
        this.selectAlbum(i);
        // 更新active
        bar.querySelectorAll('.gallery-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      });
      bar.appendChild(btn);
    });
  },

  async selectAlbum(idx){
    const album=GALLERY[idx];
    if(!album) return;
    this.currentAlbum=idx;
    this.solved=false;
    document.getElementById('victory-overlay').classList.remove('show');
    this._victoryTimeouts.forEach(clearTimeout);
    this._victoryTimeouts=[];

    // 加载图片
    await this._loadAlbumImage(album);
    // 更新UI
    document.getElementById('story-title').textContent=album.title;
    (()=>{const sb=document.getElementById('story-body');sb.textContent='';album.story.forEach(p=>{const el=document.createElement('p');el.textContent=p;sb.appendChild(el)})})();
    document.getElementById('ref-modal-img').src=album.image;
    document.getElementById('ref-thumb').src=album.image;
    // 重置游戏
    this.reset();
    this._loadBestRecord();
  },

  _loadAlbumImage(album){
    const loadId = ++this._albumLoadSeq;
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.crossOrigin='anonymous';
      img.onload=()=>{
        if(loadId !== this._albumLoadSeq) return;
        try {
          this._cutTiles(img);
        } catch(e){
          console.warn('Canvas切割失败，使用fallback:', e);
          this._generateFallbackTile();
        }
        resolve();
      };
      img.onerror=()=>{
        if(loadId !== this._albumLoadSeq) return;
        console.warn('图片加载失败，使用fallback:', album.image);
        this._generateFallbackTile();
        resolve();
      };
      img.src=album.image;
    });
  },

  _cutTiles(img){
    const size=3,total=9;
    const tw=200,th=200;
    const c=document.createElement('canvas');
    c.width=tw;c.height=th;
    const ctx=c.getContext('2d');
    this.imageTiles=[];
    for(let idx=0;idx<9;idx++){
      ctx.clearRect(0,0,tw,th);
      const row=Math.floor(idx/3),col=idx%3;
      ctx.drawImage(img,-col*tw,-row*th);
      this.imageTiles[idx]=c.toDataURL('image/jpeg',80);
    }
  },

  _generateFallbackTile(){
    const colors=['#8B4513','#D2691E','#A0522D','#CD853F','#DEB887','#D2B48C'];
    this.imageTiles=[];
    for(let i=0;i<9;i++){
      const c=document.createElement('canvas');
      c.width=200;c.height=200;
      const ctx=c.getContext('2d');
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillRect(0,0,200,200);
      ctx.fillStyle='#fff';
      ctx.font='60px serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText((i+1)+'',100,100);
      this.imageTiles[i]=c.toDataURL('image/jpeg',80);
    }
  },

  _isAdjacent(a,b){
    return Math.abs(a-b)===3 || (Math.abs(a-b)===1 && Math.floor(a/3)===Math.floor(b/3));
  },

  _loadBestRecord(){
    const album=GALLERY[this.currentAlbum];
    const key='puzzle_best_'+(album?album.id:this.currentAlbum);
    const best=localStorage.getItem(key);
    const el=document.getElementById('best-record');
    if(best){
      el.textContent='最佳: '+best+'步';
    }else{
      el.textContent='最佳: --';
    }
  },

  _saveBestRecord(){
    const album=GALLERY[this.currentAlbum];
    const key='puzzle_best_'+(album?album.id:this.currentAlbum);
    const existing=localStorage.getItem(key);
    if(!existing || this.moves<parseInt(existing,10)){
      localStorage.setItem(key,this.moves);
      this._loadBestRecord();
    }
  },

  _generateShuffle(){
    const size=3,total=9,empty=8;
    // 从完成态出发，模拟100步随机合法移动保证可解
    let state=[0,1,2,3,4,5,6,7,8];
    let ePos=8;
    for(let s=0;s<100;s++){
      const neighbors=[];
      const r=Math.floor(ePos/size),c=ePos%size;
      if(r>0) neighbors.push(ePos-size);
      if(r<size-1) neighbors.push(ePos+size);
      if(c>0) neighbors.push(ePos-1);
      if(c<size-1) neighbors.push(ePos+1);
      const pick=neighbors[Math.floor(Math.random()*neighbors.length)];
      state[ePos]=state[pick];
      state[pick]=total-1;
      ePos=pick;
    }
    return {state,empty:ePos};
  },

  reset(){
    this.moves=0;this.solved=false;
    document.getElementById('victory-overlay').classList.remove('show');
    this._victoryTimeouts.forEach(clearTimeout);
    this._victoryTimeouts=[];
    document.getElementById('move-count').textContent='步数: 0';
    this._loadBestRecord();
    if(this.timerInt){clearInterval(this.timerInt);this.timerInt=null}
    this.timer=0;
    this._startTime=null;
    document.getElementById('timer').textContent='00:00';

    const {state,empty}=this._generateShuffle();
    this.tiles=state;
    this.emptyIdx=empty;
    this.render();
    SFX.click();
  },

  showFullImage(){
    document.getElementById('ref-modal').classList.add('show');
  },

  render(){
    const grid=document.getElementById('grid');
    grid.innerHTML='';
    const size=3,total=9;

    for(let i=0;i<9;i++){
      const tileNum=this.tiles[i];
      const div=document.createElement('div');
      const isEmpty=tileNum===total-1;
      div.className='tile'+(isEmpty?' tile-empty':'');
      div.dataset.pos=i;

      if(!isEmpty){
        const bg=this.imageTiles[tileNum];
        if(bg){
          div.style.backgroundImage=`url(${bg})`;
        }
      }

      div.addEventListener('click',(e)=>{
        if(this._touchHandled){this._touchHandled=false; return;}
        this.onTileClick(i);
      });
      // 使用touchend替代touchstart的preventDefault以兼容iOS/微信
      div.addEventListener('touchend',(e)=>{
        if(!isEmpty) {
          e.preventDefault();
          this._touchHandled=true;
          this.onTileClick(i);
          setTimeout(()=>{this._touchHandled=false;},50);
        }
      },{passive:false});

      grid.appendChild(div);
    }
    this._markMovable();
  },

  _markMovable(){
    const grid=document.getElementById('grid');
    const children=grid.children;
    for(let i=0;i<children.length;i++){
      const div=children[i];
      const tileNum=this.tiles[i];
      if(tileNum!==8 && this._isAdjacent(i,this.emptyIdx)){
        div.classList.add('tile-movable');
      }else{
        div.classList.remove('tile-movable');
      }
    }
  },

  onTileClick(pos){
    if(this.solved) return;
    if(this._moving) return;
    this._moving=true;
    const tileNum=this.tiles[pos];
    if(tileNum===8) {this._moving=false; return;}
    if(!this._isAdjacent(pos,this.emptyIdx)){
      showToast('只能移动相邻碎片');
      SFX.error();
      this._moving=false;
      return;
    }

    if(!this.timerInt){
      this._startTime=Date.now();
      this.timerInt=setInterval(()=>{
        this.timer=Math.floor((Date.now()-this._startTime)/1000);
        const m=Math.floor(this.timer/60);
        const s=this.timer%60;
        document.getElementById('timer').textContent=
          String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      },1000);
    }

    this.tiles[this.emptyIdx]=tileNum;
    this.tiles[pos]=8;
    this.emptyIdx=pos;
    this.moves++;
    document.getElementById('move-count').textContent='步数: '+this.moves;
    SFX.slide();

    this.render();

    if(this._checkSolved()){
      this.onSolved();
      this._moving=false;
      return;
    }
    this._moving=false;
  },

  _checkSolved(){
    for(let i=0;i<9;i++){
      if(this.tiles[i]!==i) return false;
    }
    return true;
  },

  onSolved(){
    this.solved=true;
    if(this.timerInt){
      clearInterval(this.timerInt);
      this.timerInt=null;
    }
    // 保存最佳记录
    this._saveBestRecord();
    document.getElementById('victory-overlay').classList.add('show');
    SFX.victory();

    // 星星飘散效果
    const container=document.getElementById('puzzle');
    for(let i=0;i<6;i++){
      const star=document.createElement('div');
      star.className='star-effect';
      star.textContent=['✨','⭐','🌟','💫','✧','✦'][i];
      star.style.left=(20+Math.random()*60)+'%';
      star.style.top=(20+Math.random()*60)+'%';
      star.style.animationDelay=(i*0.12)+'s';
      container.appendChild(star);
      const t=setTimeout(()=>star.remove(),1500);
      this._victoryTimeouts.push(t);
    }

    const album=GALLERY[this.currentAlbum];
    if(album && album.hasHorse){
      const t1=setTimeout(()=>{
        document.getElementById('victory-overlay').classList.remove('show');
        
        SFX.neigh();
        const t2=setTimeout(()=>SFX.gallop(),500);
        this._victoryTimeouts.push(t2);
      },800);
      this._victoryTimeouts.push(t1);
    }else{
      const t1=setTimeout(()=>{
        document.getElementById('victory-overlay').classList.remove('show');
        showToast('🎉 恭喜完成！');
      },1200);
      this._victoryTimeouts.push(t1);
    }
  },


};

document.addEventListener('DOMContentLoaded',async()=>{
  await loadGallery();
  Puzzle.init();
});
</script>
