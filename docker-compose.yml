# PROMPT: Create Docker Compose configuration for ArtTouch NFC system
# DATE: 2026-04-19
# ENGINEER: System
# RISK-LEVEL: P2

version: "3.9"

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  db:
    image: postgres:16
    container_name: artouch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: artouch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: artouch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artouch -d artouch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - artouch-network

  # ===========================================================================
  # Redis (for rate limiting and session caching)
  # ===========================================================================
  redis:
    image: redis:7
    container_name: artouch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artouch-network

  # ===========================================================================
  # Backend API (FastAPI + Uvicorn)
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artouch-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://artouch:${POSTGRES_PASSWORD:-artouch_secure_pass_2024}@db:5432/artouch
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - NFC_BASE_URL=${NFC_BASE_URL:-https://www.qiangguoshijie.com.cn/nfc}
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - artouch-network

  # ===========================================================================
  # Frontend (Nginx serving Vue SPA)
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: artouch-frontend
    restart: unless-stopped
    volumes:
      - ./static:/usr/share/nginx/html/static:ro
      # SSL certificates (mount empty dir if certs not yet obtained)
      - ./certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - artouch-network

# =============================================================================
# Networks
# =============================================================================
networks:
  artouch-network:
    driver: bridge

# =============================================================================
# Volumes (Persistent data)
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
